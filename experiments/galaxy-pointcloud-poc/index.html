<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Galaxy Point Cloud PoC</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <main class="shell">
    <canvas id="galaxy-canvas" aria-label="银河三维点云"></canvas>
    <section class="hud" aria-label="银河点云调试面板">
      <div class="eyebrow">PHASE 3.5A / IMAGE-DERIVED GALAXY</div>
      <h1>银河点云重构</h1>
      <p>从单张摄影图像提取结构，以受限视差观察银河空间厚度。</p>
      <details open class="control-group view-group">
        <summary>View mode</summary>
        <div class="mode-row" role="group" aria-label="显示模式">
          <button data-mode="hybrid" class="mode active">Hybrid</button>
          <button data-mode="pointcloud" class="mode">Point Cloud</button>
          <button data-mode="original" class="mode">Original</button>
        </div>
      </details>
      <details open class="control-group primary-group">
        <summary>Primary controls</summary>
        <label class="priority-control">Camera progress <output id="progress-value">0.00</output><input id="progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="Camera progress"></label>
        <label>Residual opacity <output id="residual-value">0.35</output><input id="residual" type="range" min="0" max="1" step="0.01" value="0.35"></label>
        <label>Depth strength <output id="depth-value">1.00</output><input id="depth" type="range" min="0" max="1.8" step="0.01" value="1"></label>
        <label>Nebula thickness <output id="thickness-value">1.00</output><input id="thickness" type="range" min="0.2" max="2" step="0.01" value="1"></label>
        <label>Camera parallax <output id="parallax-value">1.00</output><input id="parallax" type="range" min="0" max="2" step="0.01" value="1"></label>
        <label>Morph amount <output id="morph-value">0.00</output><input id="morph" type="range" min="0" max="1" step="0.01" value="0"></label>
      </details>
      <details class="control-group">
        <summary>Advanced controls</summary>
        <label>Star size <output id="star-size-value">1.00</output><input id="star-size" type="range" min="0.4" max="2" step="0.01" value="1"></label>
        <label>Nebula size <output id="nebula-size-value">1.00</output><input id="nebula-size" type="range" min="0.4" max="2" step="0.01" value="1"></label>
        <label>Point density <output id="point-density-value">1.00</output><input id="point-density" type="range" min="0.15" max="1" step="0.01" value="1"></label>
        <label>Camera flight speed <output id="flight-speed-value">1.00</output><input id="flight-speed" type="range" min="0.2" max="2" step="0.01" value="1"></label>
        <label>Star layer intensity <output id="star-intensity-value">1.00</output><input id="star-intensity" type="range" min="0" max="1.5" step="0.01" value="1"></label>
        <label>Foreground cleanup <output id="foreground-cleanup-value">0.70</output><input id="foreground-cleanup" type="range" min="0" max="1" step="0.01" value="0.7"></label>
        <label>Foreground softness <output id="foreground-softness-value">1.00</output><input id="foreground-softness" type="range" min="0.5" max="2" step="0.01" value="1"></label>
        <label class="check"><span>Bloom</span><input id="bloom" type="checkbox" checked></label>
        <label>Bloom strength <output id="bloom-value">0.42</output><input id="bloom-strength" type="range" min="0" max="1" step="0.01" value="0.42"></label>
      </details>
      <details open class="control-group layers-group">
        <summary>Layer visibility</summary>
        <label class="check"><span>Bright Stars</span><input id="star-bright" type="checkbox" checked></label>
        <label class="check"><span>Medium Stars</span><input id="star-medium" type="checkbox" checked></label>
        <label class="check"><span>Dust Stars</span><input id="star-dust" type="checkbox" checked></label>
        <label class="check"><span>Foreground Dust</span><input id="foreground-dust" type="checkbox" checked></label>
        <label class="check"><span>Front Nebula</span><input id="nebula-front" type="checkbox" checked></label>
        <label class="check"><span>Mid Nebula</span><input id="nebula-mid" type="checkbox" checked></label>
        <label class="check"><span>Back Nebula</span><input id="nebula-back" type="checkbox" checked></label>
        <label class="check"><span>Residual Backdrop</span><input id="residual-backdrop" type="checkbox" checked></label>
      </details>
      <div class="stats" id="stats">Loading point cloud…</div>
    </section>
    <div class="scroll-hint">Scroll or drag Camera progress · move the pointer to explore depth</div>
  </main>
  <div class="scroll-space" aria-hidden="true"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
